version: "3.9"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-test-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: portfolio_test
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend

  test-runner-1:
    build: .
    command: ["npm", "test", "--", "--testPathPattern", "tests/admin"]
    env_file: .env
    environment:
      NODE_ENV: test
      TEST_MONGODB_URI: "mongodb://mongo:27017/portfolio_test_1"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - test-reports:/app/test-reports
    working_dir: /app
    networks:
      - backend

  test-runner-2:
    build: .
    command: ["npm", "test", "--", "--testPathPattern", "tests/api"]
    env_file: .env
    environment:
      NODE_ENV: test
      TEST_MONGODB_URI: "mongodb://mongo:27017/portfolio_test_2"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - test-reports:/app/test-reports
    working_dir: /app
    networks:
      - backend

  test-runner-3:
    build: .
    command: ["npm", "test", "--", "--testPathPattern", "tests"]
    env_file: .env
    environment:
      NODE_ENV: test
      TEST_MONGODB_URI: "mongodb://mongo:27017/portfolio_test_3"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - test-reports:/app/test-reports
    working_dir: /app
    networks:
      - backend

volumes:
  mongo-test-data:
  test-reports:

networks:
  backend:
    driver: bridge
