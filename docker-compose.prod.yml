version: "3.9"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: portfolio
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    secrets:
      - mongo_uri
      - jwt_secret
      - admin_email
      - admin_password
    # Read‑only root filesystem; mount a writable tmp if needed
    read_only: true
    volumes:
      - app-tmp:/app/tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
    # The image built from Dockerfile will run as a non‑root user
    command: ["npm", "start"]

  # Optional reverse‑proxy – enabled when ENABLE_PROXY=true in .env
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "443:443"
      - "80:80"
    environment:
      ENABLE_PROXY: "${ENABLE_PROXY:-false}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - frontend
    # Only run if ENABLE_PROXY is true – we let Caddy exit otherwise
    entrypoint: ["/bin/sh", "-c", "if [ \"$ENABLE_PROXY\" = \"true\" ]; then caddy run --config /etc/caddy/Caddyfile; else echo 'Proxy disabled'; sleep infinity; fi"]

volumes:
  mongo-data:
  app-tmp:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

secrets:
  mongo_uri:
    file: ./secrets/mongodb_uri.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  admin_email:
    file: ./secrets/admin_email.txt
  admin_password:
    file: ./secrets/admin_password.txt
