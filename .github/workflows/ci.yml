name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Check for syntax errors
        working-directory: server
        run: node -e "require('./app.js')"

      - name: Verify frontend files
        run: |
          test -f client/index.html
          test -f client/css/style.css
          test -f client/css/responsive.css
          test -f client/js/config.js
          test -f client/js/api.js
          test -f client/js/utils.js
          test -f client/js/theme.js
          test -f client/js/navigation.js
          test -f client/js/animations.js
          test -f client/js/sections.js
          test -f client/js/app.js
          echo "✅ All frontend files present"
