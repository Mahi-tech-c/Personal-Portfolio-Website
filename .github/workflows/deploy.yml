name: CI & Deploy to Vercel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'" 
          --health-start-period 10s
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/portfolio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Wait for MongoDB service
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..15}; do
            nc -z localhost 27017 && break || sleep 1
          done

      - name: Run tests with coverage
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/portfolio_test
        run: npm test -- --testTimeout=30000 || true

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Vercel Config
        run: |
          mkdir -p .vercel
          if [ -n "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo '{"orgId":"${{ secrets.VERCEL_ORG_ID }}","projectId":"${{ secrets.VERCEL_PROJECT_ID || 'prj_KrxBDOVxD0dAcbMiTvz71u40kn1B' }}"}' > .vercel/project.json
          else
            echo '{"projectId":"${{ secrets.VERCEL_PROJECT_ID || 'prj_KrxBDOVxD0dAcbMiTvz71u40kn1B' }}"}' > .vercel/project.json
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_KrxBDOVxD0dAcbMiTvz71u40kn1B' }}
        run: |
          DEPLOYMENT_URL=$(npx vercel --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes)
          echo "Live Deployment URL: $DEPLOYMENT_URL"
          echo "### 🚀 Live Vercel Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Your website is live at: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
